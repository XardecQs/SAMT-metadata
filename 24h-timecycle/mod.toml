author = ["aap (The Hero)"]
url = "https://www.mixmods.com.br/2017/08/24h-timecycle-timecyc-dat-de-24-horas"
description = "El archivo timecyc.dat es muy importante para los gráficos del juego, ya que es donde se configuran los ajustes de color, iluminación, sombras y luz, separados por hora, ubicación y clima. Desafortunadamente, el archivo originalmente sólo tenía 8 ajustes de hora diferentes (0 AM, 5 AM, 6 AM, 7 AM, 12 PM, 7 PM y 8 PM), una limitación que causaba inexactitud. The Hero —creador de SkyGfx— resolvió este problema: ahora GTA SA leerá un archivo timecyc.dat con 24 ajustes de hora diferentes (timecyc_24h.dat)."
