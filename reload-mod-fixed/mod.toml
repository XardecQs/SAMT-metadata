description = "Versión corregida y actualizada de Reload Mod (recarga manual de armas con R o mando): arregla la doble recarga, la recarga sin munición de reserva, la recarga de armas sin animación y los problemas de recarga con mando a pie y en vehículo, y añade el ajuste DisablePickupClipRefill (no rellenar el cargador al recoger armas). Es una revisión no oficial de un tercero, separada del Reload Mod original. Compatible con Keep No Ammo (KeepNoAmmo=1 en su .ini). Requiere CLEO (Essentials Pack)."
