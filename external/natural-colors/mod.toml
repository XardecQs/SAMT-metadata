# GTA Mod Organizer manifest — Natural Colors
id = "makar_s:natural-colors"
name = "Natural Colors"
version = "2026-10-07"
author = ["Makar S."]
url = "https://libertycity.net/files/gta-san-andreas/244199-natural-colors.html"
description = "Mod gráfico (ajuste de timecycle) que busca un aspecto más realista: iluminación, contraste de sombras estáticas y colores de cielo realistas según hora, clima y zona, con noches realmente oscuras. Incluye Particle.txd con texturas de deslumbramiento solar, faros y sombras estáticas, y un script CLEO necesario para los faros de los vehículos. Se recomienda brillo 5 y desactivar las sombras dinámicas. Requiere CLEO y SilentPatch (Essentials Pack); en SA-MP hay que copiar timecyc.dat, timecycp.dat y particle.txd a la carpeta de ModdedSAA. Alternativa a Real Linear Graphics: ambos definen el timecycle, así que solo uno puede estar activo. Con 24h TimeCycle usa la opción 'timecycle = 24h' (timecyc convertido); sin él, 'timecycle = 8h'."
tags = ["graphics", "textures"]
cover = "cover.avif"
mount = ["content"]
screenshots = ["screenshots"]
conflicts = ["junior_djjr:real-linear-graphics", "samper_dtr:water-reflections", "junior_djjr:enhanced-classic-graphics", "ezekiel:nextgen-remaster-effects"]

[[options]]
group = "timecycle"
name = "Formato de timecycle"
default = "24h"

  # Requiere el ASI de 24h TimeCycle (que lee timecyc_24h.dat). Convertido del
  # timecyc.dat original con el conversor del propio 24h TimeCycle.
  [[options.choices]]
  key = "24h"
  name = "24h (timecyc_24h.dat)"
  requires_any = ["aap:24h-timecycle"]

  # Formato original de 8 horas, para jugar sin el ASI de 24h TimeCycle.
  [[options.choices]]
  key = "8h"
  name = "Original 8h (timecyc.dat)"

[dependencies]
required = ["mixmods:essentials-pack"]
