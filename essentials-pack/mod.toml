# GTA Mod Organizer manifest
id = "mixmods:essentials-pack"
name = "SA Essentials Pack"
version = "2026-08-16"
author = ["MixMods", "Junior_Djjr"]
url = "https://www.mixmods.com.br/2019/06/sa-essentials-pack/"
description = "Pack de correcciones y componentes esenciales para GTA SA: SilentPatch, ModLoader, CLEO/CLEO+, CrashInfo, NoDEP, Widescreen Fix, EXE 1.0 US Hoodlum, etc."
tags = ["essential", "fixes", "pack", "tools"]
cover = "cover.png"
mount = ["content"]
guides = ["guides"]

[dependencies]
required = ["doitsujin:d3d9"]

