# GTA Mod Organizer manifest — Ultimate First Person
id = "peter_99:ultimate-fp"
name = "Ultimate First Person"
version = "0.7.0"
author = ["peter_99"]
url = "https://www.patreon.com/peter_99/posts/ultimate-first-7-167366898"
description = "Mod de primera persona para GTA SA (versión Patreon v0.7.0): apuntado (ADS) con transición suave, retroceso por arma, zoom manual, FOV con FX de entrada, modo cinemático (p. ej. al recargar), giro natural del cuerpo y soporte de mando. El menú se abre con Alt+X (o el truco UFPMENU) y la configuración se puede editar con share/config-editor.html. Expone una API para otros mods (dev/UltimateFP_SA_API.h). Existe una versión Beta pública en libertycity (239321). Requiere un cargador ASI (Essentials Pack); GInput para mando."
tags = ["player", "gameplay"]
cover = "cover.avif"
mount = ["content"]
guides = ["guides"]
screenshots = ["screenshots"]

[dependencies]
required = ["mixmods:essentials-pack"]
optional = ["silent:ginput"]
