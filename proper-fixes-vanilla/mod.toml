# GTA Mod Organizer manifest — Proper Fixes (estándar)
id = "mixmods:proper-fixes-vanilla"
name = "Proper Fixes"
version = "2.1.1"
author = ["Junior_Djjr", "Jéssica Natália"]
url = "https://www.mixmods.com.br/2026/06/sa-proper-fixes/"
description = "El mayor pack de correcciones para GTA SA (versión estándar, NO adaptada a RoSA Evolved)."
tags = ["fixes", "essential"]
cover = "cover.png"
mount = ["content"]
screenshots = ["screenshots"]

# No se puede usar con RoSA Evolved (hay que usar la variante de Proper Fixes para RoSA).
conflicts = ["jessica_natalia:rosa-evolved-june", "jessica_natalia:rosa-evolved-june-lite"]
# Necesita Proper Shaders o SkyGfx (buildingPipe=PS2).
requires_any = ["mixmods:proper-shaders", "aap:sa-skygfx-extended"]

[variant]
group = "proper-fixes"
name = "Vanilla"

[modloader]
priority = 60

[dependencies]
required = ["mixmods:essentials-pack", "link2012:open-limit-adjuster"]
