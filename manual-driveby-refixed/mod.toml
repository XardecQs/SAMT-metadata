# GTA Mod Organizer manifest — Manual Driveby Refixed
id = "catchyketchup:manual-driveby-refixed"
name = "Manual Driveby Refixed"
version = "26.08.25"
author = ["CatchyKetchup", "ThirteenAG", "Junior_Djjr", "ArtemQa146"]
url = "https://libertycity.net/files/gta-san-andreas/213857-manual-driveby-refixed.html"
description = "Permite apuntar y disparar libremente desde cualquier vehículo (coches, motos, barcos, helicópteros, aviones y trenes), además de lanzar granadas y usar armas de spray. Rehecho casi desde cero sobre 'Manual Driveby Remake': corrige cierres y bugs y añade muchas opciones (teclas, cadencia por arma, cámaras, romper el parabrisas, reclutar pandilleros, excluir vehículos...). Todo se configura en DrivebySettings.ini. Requiere Essentials Pack (CLEO+)."
tags = ["vehicles", "weapons", "cleo"]
cover = "cover.avif"
mount = ["content"]
guides = ["guides"]
screenshots = ["screenshots"]

[[options]]
group = "anims"
name = "Animaciones"
default = "refixed"

  # Animaciones nuevas del autor (por defecto).
  [[options.choices]]
  key = "refixed"
  name = "Refixed (por defecto)"

  # Animaciones antiguas incluidas en el pack (opcional).
  [[options.choices]]
  key = "old"
  name = "Antiguas"

[dependencies]
required = ["mixmods:essentials-pack"]
