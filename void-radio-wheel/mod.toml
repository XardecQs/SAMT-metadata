description = "Rueda de emisoras de radio integrada en el estilo del juego: se abre con tecla (por defecto TAB) o con la rueda del ratón, compatible con mando (requiere GInput) y con SAMP, y con muchas opciones en el .ini (slow motion, filtro, tamaño/posición, iconos, sonidos, User Track…). Requiere CLEO+. Los ficheros opcionales (idioma y compatibilidad con Original Radio Extender) están en extras/optional."
