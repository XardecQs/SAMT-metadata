# GTA Mod Organizer manifest
id = "junior_djjr:improved-streaming"
name = "Improved Streaming"
version = "1.1.0"
author = ["Junior_Djjr"]
url = "https://www.mixmods.com.br/2026/07/improved-streaming"
description = "Este mod, anteriormente conocido como 'Load Whole Map', precarga los archivos del juego para mejorar el uso de la RAM, reduciendo así el espacio en disco y los costes de procesamiento. Esto soluciona los 'agujeros' azules en el mapa causados por la lentitud de carga de los objetos. También corrige o previene los tirones, los picos de latencia y los parpadeos durante el juego."
tags = ["fixes"]
cover = "cover.jpg"
mount = ["content"]

[dependencies]
required = ["mixmods:essentials-pack"]
