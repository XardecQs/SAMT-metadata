# GTA Mod Organizer manifest — Bullethole
id = "ryosuke839:bullethole"
name = "Bullethole (buracos de tiros)"
version = "2015-06-28"
author = ["Ryosuke839"]
url = "https://www.mixmods.com.br/2015/06/bullethole-buracos-de-tiros/"
description = "Plugin ASI que deja agujeros de bala en las superficies al disparar, con textura/efecto por material (madera, metal, cristal, etc.) y tamaño según el arma; el número máximo de agujeros y su duración se ajustan en bullethole.ini. La textura bullethole.png debe quedar junto al .asi (si falta, salen cuadrados blancos). Si tu GPU no soporta D3DRS_DEPTHBIAS/SLOPESCALEDDEPTHBIAS, activa NormalBias en el .ini. Puede requerir el DirectX 9 Runtime. Requiere un cargador ASI (Essentials Pack)."
tags = ["weapons", "effects"]
