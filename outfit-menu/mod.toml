# GTA Mod Organizer manifest — Outfit Menu (Outfit Inventory System)
id = "scarbuttcheeks:outfit-menu"
name = "Outfit Menu (Outfit Inventory System)"
version = "1.0"
author = ["ScarButtCheeks"]
url = "https://libertycity.net/files/gta-san-andreas/232418-outfit-menu-outfit-inventory-system.html"
description = "Menú en el juego para guardar, cargar y borrar los conjuntos de ropa de CJ (5 ranuras, marcadas como USED/EMPTY, con confirmación al sobrescribir o borrar). Compatible con teclado y mando, controles configurables en controls.ini y textos editables/localizables por el .fxt. El menú no se abre dentro de un vehículo ni en misiones, y se cierra si mueres o entras en un coche. Complementa a Faster Clothes Change. Requiere ModLoader y CLEO (Essentials Pack)."
tags = ["player", "interface", "cleo"]
cover = "cover.webp"
mount = ["content"]
guides = ["guides"]
screenshots = ["screenshots"]

[dependencies]
required = ["mixmods:essentials-pack"]
