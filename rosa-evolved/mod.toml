# GTA Mod Organizer manifest — RoSA Evolved (4K / LITE)
id = "jessica_natalia:rosa-evolved"
name = "RoSA Evolved"
version = "1.4"
author = ["Jéssica Natália", "MixMods"]
url = "https://www.mixmods.com.br/2023/07/rosa-project-evolved-remaster-texturas-hd/"
description = "Pack de texturas remasterizadas para GTA San Andreas (versión pública de junio). Elige la resolución (4K o LITE) por perfil."
tags = ["textures", "hd", "remaster"]
cover = "cover.avif"
mount = ["content"]
guides = ["guides"]
screenshots = ["screenshots"]

# Requiere memoria de streaming ampliada: basta con uno de estos.
requires_any = ["link2012:open-limit-adjuster", "junior_djjr:improved-streaming", "junior_djjr:mixsets"]

[[options]]
group = "variant"
name = "Resolución"

  [[options.choices]]
  key = "4k"
  name = "4K"

  [[options.choices]]
  key = "lite"
  name = "LITE"

[modloader]
priority = 50

[dependencies]
required = ["mixmods:essentials-pack"]
optional = ["mixmods:proper-fixes"]
