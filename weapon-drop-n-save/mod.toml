# GTA Mod Organizer manifest — Weapon Drop 'N Save
id = "mkkj:weapon-drop-n-save"
name = "Weapon Drop 'N Save"
version = "1.3"
author = ["MKKJ"]
url = "https://www.mixmods.com.br/2019/12/weapon-drop-n-save-v1-3-largar-e-salvar-armas/"
description = "Permite soltar el arma actual y, si mantienes la combinación, guardarla como recogible. Pulsa TAB+N para soltarla (desaparece tras un rato) o mantén TAB+N hasta oír la confirmación para guardarla de forma permanente. Se guardan hasta 10 armas (al superar el límite se elimina la más antigua) y la información queda en tu partida, en un archivo de la carpeta CLEO\\cleo_saves. Requiere CLEO (Essentials Pack)."
