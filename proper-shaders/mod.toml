# GTA Mod Organizer manifest
id = "mixmods:proper-shaders"
name = "Proper Shaders"
version = "2026-08"
author = ["MixMods", "Junior_Djjr", "Jéssica Natália"]
url = "https://www.mixmods.com.br/2026/05/sa-proper-shaders"
description = "Proper Shaders remasteriza los gráficos de GTA San Andreas en HD para ofrecer una experiencia verdaderamente jugable, no solo para capturas de pantalla."
tags = ["graphics", "hd"]
cover = "cover.webp"
mount = ["content"]
guides = ["guides"]

[[options]]
group = "preset"
name = "Preset de calidad"

  [[options.choices]]
  key = "only-improvements"
  name = "0b - Solo mejoras"

  [[options.choices]]
  key = "very-low"
  name = "1a - Muy bajo"

  [[options.choices]]
  key = "very-low-no-shadows"
  name = "1b - Muy bajo (sin sombras)"

  [[options.choices]]
  key = "low"
  name = "2 - Bajo"

  [[options.choices]]
  key = "medium"
  name = "3a - Medio (por defecto)"

  [[options.choices]]
  key = "high"
  name = "4 - Alto"

  [[options.choices]]
  key = "very-high"
  name = "5 - Muy alto"

[dependencies]
required = ["mixmods:essentials-pack"]
